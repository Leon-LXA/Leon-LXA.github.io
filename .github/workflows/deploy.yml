name: Build and deploy homepage

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      JEKYLL_ENV: production
      EXECJS_RUNTIME: Node
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node for JavaScript minification
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
    - name: Install image tools
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y imagemagick
    - name: Build
      run: bundle exec jekyll build --trace
    - name: Deploy
      if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        folder: _site

