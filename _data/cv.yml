- title: Research Experience
  type: time_table
  contents:
  - title: Assembly Motion Generation for Action Recognition
    year: 2024-08 - 2025-02
    maindescription: 'Master''s Thesis Student, ETH Zurich. Grade: 6.0/6.0. Advisor: Prof. Dr. Mirko Meboldt (Pd|z).'
    description:
    - Used reinforcement learning with the GraspXL framework for scalable dexterous grasp generation.
    - Synthesized assembly motions with a grasping hand in simulation.
    - Trained action recognition models using synthetic assembly motions and labels.
  - title: Adversarial Learning via Differentiable Simulation
    year: 2023-11 - 2024-03
    maindescription: 'Semester Project Student, ETH Zurich. Advisor: Prof. Fan Shi (ETH AI Center).'
    description:
    - Developed adversarial attacks on quadruped locomotion policies using gradient information from differentiable
      simulation.
    - Applied projected gradient descent to joint-state inputs to disrupt legged robot locomotion.
  - title: Adaptive Mechanism Design in Sequential Social Dilemmas
    year: 2023-04 - 2023-06
    maindescription: 'Student, ETH Zurich. Advisor: Dr. Vinzenz Thoma (D-INFK, ETH AI Center).'
    description:
    - Reimplemented the adaptive mechanism design (AMD) algorithm using Ray RLlib, validated it on the prisoner's
      dilemma, and adapted it to more complex multi-agent environments.
    - Provided open-source implementations of the Wolfpack and Gathering environments.
  - title: Navigation of Mobile Robots on Rough Terrain
    year: 2021-06 - 2022-09
    maindescription: 'Research Assistant, Tsinghua University, Shenzhen, China. Advisor: Prof. Xueqian Wang.'
    description:
    - Developed real-time SLAM and navigation for the AgileX SCOUT platform on extremely rough terrain.
    - Used model predictive control (MPC) and control barrier functions (CBFs) for local collision avoidance, and
      PF-RRT* for global planning.
    - Built point-cloud maps of complex terrain.
